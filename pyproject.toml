[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inelida-marketscan"
version = "1.0.2"
description = "Scanner multi-TF ICT x Ichimoku automatise — Diamond Analysis, Asian Sweeps, P&L Tracker"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Inelida", email = "inelida@proton.me"}
]
keywords = ["forex", "trading", "ict", "ichimoku", "mt5", "metatrader", "scanner", "technical-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.10"
dependencies = [
    "MetaTrader5>=5.0.5735",
    "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://reuniware.vercel.app"
Documentation = "https://github.com/reuniware/InelidaMarketScanner/blob/main/GUIDE_UTILISATEUR.md"
Repository = "https://github.com/reuniware/InelidaMarketScanner"
Issues = "https://github.com/reuniware/InelidaMarketScanner/issues"

[project.scripts]
inelida = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["*.md"]
